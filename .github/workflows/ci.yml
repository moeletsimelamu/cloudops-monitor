# Continuous integration: every branch except main, every pull request, and, through deploy.yml,
# every push to main before anything is published. Each job starts from a clean Linux machine.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when deploy.yml runs this, so the two never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest version pyproject.toml accepts; 3.14 is what development and the image use.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install (pinned by constraints.txt)
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Lint (backend and scripts/)
        run: ruff check --config pyproject.toml . ../scripts

      - name: Formatting
        run: ruff format --check --config pyproject.toml . ../scripts

      - name: Type check
        run: mypy

      - name: Tests (local servers only; GitHub is faked)
        # Each failure also becomes an annotation, readable on the run page without opening the log.
        run: |
          set +e
          python -m pytest -rfE --tb=line 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | sed 's/^/::error title=pytest::/'
          grep -E '^/.*:[0-9]+: ' pytest.log | head -20 | sed 's/^/::error title=pytest traceback::/'
          exit "$status"

  sandbox:
    name: Sandbox · lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/constraints.txt

      - name: Install (the backend's dev tools and pins)
        run: python -m pip install -c backend/constraints.txt -e "./backend[dev]" -e ./sandbox

      - name: Lint, formatting and types
        working-directory: sandbox
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tests
        working-directory: sandbox
        run: python -m pytest

  frontend:
    name: Frontend · tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      # Known vulnerabilities in what runs in production: every pinned Python package, and the
      # npm packages that end up in the browser bundle. Development-only npm packages are not
      # shipped, so they are not checked here.
      - name: Python packages (pip-audit)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --strict --disable-pip --no-deps -r backend/constraints.txt

      - name: npm packages in the bundle (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  container:
    name: Container images · build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Throwaway values for this run only.
      CLOUDOPS_OPERATOR_TOKEN: ci-operator-token-${{ github.run_id }}-${{ github.run_attempt }}-0123456789
      SANDBOX_CONTROL_TOKEN: ci-sandbox-control-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Build both images
        run: docker compose build

      - name: Image hygiene (non-root, empty data volume, no .env files, no docs or tests)
        run: |
          test "$(docker run --rm cloudops-monitor:local id -u)" = "10001"
          test "$(docker run --rm cloudops-sandbox:local id -u)" = "10002"
          test -z "$(docker run --rm cloudops-monitor:local ls -A /data)"
          test -z "$(docker run --rm cloudops-monitor:local sh -c 'find / -xdev -name ".env*" 2>/dev/null')"
          test -z "$(docker run --rm cloudops-monitor:local sh -c 'ls /app/src /app/tests /app/docs 2>/dev/null')"
          # A bare "! command" does not stop a bash -e script, hence the explicit checks.
          if docker run --rm cloudops-monitor:local sh -c 'touch /app/static/index.html' 2>/dev/null; then
            echo "The server user can change the app files"; exit 1
          fi
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'cloudops-(monitor|sandbox)'

      - name: Start CloudOps Monitor and the sandbox
        run: docker compose up -d --no-build

      - name: Smoke test (the primary workflow through the container)
        run: >
          python3 scripts/smoke.py
          --base http://127.0.0.1:8300
          --sandbox http://127.0.0.1:8310
          --target http://sandbox:8310/health
          --expect-frontend --expect-docs-off

      - name: Logs are JSON lines
        run: |
          docker compose logs --no-log-prefix cloudops > cloudops.log
          python3 -c "import json,sys; lines=[l for l in open('cloudops.log') if l.strip()]; [json.loads(l) for l in lines]; print(len(lines), 'JSON lines')"
          if grep -qF "$CLOUDOPS_OPERATOR_TOKEN" cloudops.log; then
            echo "The operator token appears in the logs"; exit 1
          fi

      - name: Health check reported by Docker
        run: |
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q cloudops)")"
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          echo "Container health: $state"
          [ "$state" = "healthy" ]

      - name: Data survives a restart
        run: |
          docker compose restart cloudops
          python3 - <<'EOF'
          import json, os, time, urllib.request
          token = os.environ["CLOUDOPS_OPERATOR_TOKEN"]
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8300/api/health/ready", timeout=3) as r:
                      if json.load(r)["status"] == "ready":
                          break
              except OSError:
                  pass
              time.sleep(1)
          request = urllib.request.Request(
              "http://127.0.0.1:8300/api/events?type=application.removed",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=10) as r:
              items = json.load(r)["items"]
          assert items, "the smoke test's audit event did not survive the restart"
          print("Events from before the restart:", len(items))
          EOF

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop and remove
        if: always()
        run: docker compose down -v
