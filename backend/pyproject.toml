[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-monitor"
version = "0.1.0"
description = "Deployment and application-health monitoring: health checks, deployments, logs and events."
requires-python = ">=3.12"
authors = [{ name = "Moeletsi Melamu" }]
# Direct dependencies are pinned exactly. Transitive versions are pinned in constraints.txt.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "httpx2==2.16.0",
    # Used directly by the health-check probe (custom network backend for pinned connections).
    "httpcore2==2.16.0",
    "anyio==4.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
]

[project.scripts]
cloudops = "cloudops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic migration scripts and template ship with the package so the container can migrate.
"cloudops.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Generated by Alembic autogenerate; long CHECK constraint expressions stay on one line.
"src/cloudops/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["cloudops", "tests"]
